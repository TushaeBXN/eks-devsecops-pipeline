apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devsecops-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TushaeBXN/eks-devsecops-pipeline
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
